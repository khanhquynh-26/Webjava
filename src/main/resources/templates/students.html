<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f6f9; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .btn-group { margin-bottom: 20px; display: flex; gap: 10px; }
        button { padding: 9px 18px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>
<div class="container">
    <h2>Thêm / Sửa Sinh Viên</h2>
    
    <form id="studentForm">
        <input type="hidden" id="id">
        <div class="form-grid">
            <input type="text" id="studentCode" placeholder="Mã SV (VD: SV004)" required>
            <input type="text" id="fullName" placeholder="Full Name (Họ tên)" required>
            <input type="email" id="email" placeholder="Gmail" required>
            <input type="text" id="phone" placeholder="Số điện thoại" required>
            <input type="text" id="className" placeholder="Class Name (Lớp)" required>
        </div>
        <div class="btn-group">
            <button type="submit" class="btn-success" id="btnSubmit">Lưu Sinh Viên</button>
            <button type="button" class="btn-warning" onclick="resetForm()">Làm mới Form</button>
        </div>
    </form>

    <hr>
    <h2>Danh Sách Sinh Viên</h2>
    <div style="margin-bottom: 15px;">
        <input type="text" id="searchInput" placeholder="Tìm kiếm..." onkeyup="loadStudents()">
    </div>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Mã SV</th>
                <th>Full Name</th>
                <th>Gmail</th>
                <th>Số Điện Thoại</th>
                <th>Class Name</th>
                <th>Hành Động</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
</div>

<script>
    const API_URL = '/api/students';

    document.addEventListener('DOMContentLoaded', loadStudents);

    function loadStudents() {
        const keyword = document.getElementById('searchInput').value;
        const url = keyword ? `${API_URL}?keyword=${encodeURIComponent(keyword)}` : API_URL;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('studentTableBody');
                tbody.innerHTML = '';
                data.forEach((st, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${st.studentCode || ''}</strong></td>
                            <td>${st.fullName || ''}</td>
                            <td>${st.email || ''}</td>
                            <td>${st.phone || ''}</td>
                            <td>${st.className || ''}</td>
                            <td>
                                <button class="btn-warning" onclick="editStudent('${st.id}')">Sửa</button>
                                <button class="btn-danger" onclick="deleteStudent('${st.id}')">Xóa</button>
                            </td>
                        </tr>
                    `;
                });
            })
            .catch(err => console.error('Lỗi load danh sách:', err));
    }

    function editStudent(id) {
        fetch(`${API_URL}/${id}`)
            .then(res => res.json())
            .then(st => {
                document.getElementById('id').value = st.id;
                document.getElementById('studentCode').value = st.studentCode || '';
                document.getElementById('fullName').value = st.fullName || '';
                document.getElementById('email').value = st.email || '';
                document.getElementById('phone').value = st.phone || '';
                document.getElementById('className').value = st.className || '';
                document.getElementById('btnSubmit').innerText = 'Cập nhật Sinh Viên';
            });
    }

    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('id').value;
        const student = {
            studentCode: document.getElementById('studentCode').value,
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            className: document.getElementById('className').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(student)
        })
        .then(res => {
            if (!res.ok) throw new Error('Lỗi khi lưu');
            return res.json();
        })
        .then(() => {
            resetForm();
            loadStudents();
        })
        .catch(err => alert('Không thể lưu thông tin sinh viên!'));
    });

    function resetForm() {
        document.getElementById('id').value = '';
        document.getElementById('studentForm').reset();
        document.getElementById('btnSubmit').innerText = 'Lưu Sinh Viên';
    }

    function deleteStudent(id) {
        if (confirm('Bạn có chắc chắn muốn xóa?')) {
            fetch(`${API_URL}/${id}`, { method: 'DELETE' }).then(() => loadStudents());
        }
    }
</script>
</body>
</html>
